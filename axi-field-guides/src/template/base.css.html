<style>
/* AXI field guides. Color encodes who drives a signal: amber = Manager (class lp), teal = Subordinate (class pl),
   violet = credits, interface-level signals and annotations (class sb). */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5a6676;
  --line: #d8dee6;
  --pl: #0d6f8f;
  --lp: #a85a07;
  --sb: #6a4cc0;
  --hl: rgba(13, 111, 143, 0.10);
  --code: #eef1f5;
  --bad: #b3261e;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319;
    --surface: #151c24;
    --ink: #e5eaf0;
    --muted: #93a0af;
    --line: #2a3541;
    --pl: #52b9d8;
    --lp: #efa452;
    --sb: #a891f2;
    --hl: rgba(82, 185, 216, 0.14);
    --code: #1c2530; --bad: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319;
  --surface: #151c24;
  --ink: #e5eaf0;
  --muted: #93a0af;
  --line: #2a3541;
  --pl: #52b9d8;
  --lp: #efa452;
  --sb: #a891f2;
  --hl: rgba(82, 185, 216, 0.14);
  --code: #1c2530; --bad: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
}
a { color: var(--pl); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--pl); outline-offset: 2px; }
code, .mono { font-family: var(--font-mono); font-size: 0.88em; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
.lp { color: var(--lp); }
.pl { color: var(--pl); }
.sbc { color: var(--sb); }

header.top {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.hero { padding: 36px 0 26px; display: grid; gap: 10px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: clamp(30px, 4.4vw, 44px); font-weight: 600; }
h2 { font-size: 28px; font-weight: 600; }
h3 { font-size: 19px; font-weight: 600; }
.lede { max-width: 68ch; color: var(--muted); margin: 0; font-size: 17px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 3px; border-radius: 2px; display: inline-block; }

nav.toc {
  position: sticky; top: 0; z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
nav.toc .wrap { display: flex; gap: 4px; overflow-x: auto; padding-top: 6px; padding-bottom: 6px; }
nav.toc a {
  white-space: nowrap; text-decoration: none; color: var(--muted);
  font-size: 14px; padding: 6px 10px; border-radius: 6px;
}
nav.toc a:hover { background: var(--hl); color: var(--ink); }

section { padding: 44px 0 8px; }
section > .wrap > h2 { margin-bottom: 6px; }
.sub { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
p { max-width: 70ch; }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 18px 20px; display: grid; gap: 8px; align-content: start;
}
.card p { margin: 0; }
.card .k { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tagline { font-family: var(--font-mono); font-size: 12px; color: var(--pl); }

figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
figure svg { max-width: 100%; height: auto; display: block; }
figcaption { color: var(--muted); font-size: 14px; margin-top: 10px; }

.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-mono); font-weight: 500; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td.sig { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
td.num, th.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.dir { font-family: var(--font-mono); font-size: 12px; white-space: nowrap; }
.pill { display: inline-block; font-family: var(--font-mono); font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.chip {
  font-family: var(--font-body); font-size: 13px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 12px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--pl); border-color: var(--pl); color: var(--surface); }

/* Waveform viewer */
.viewer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); padding: 8px 8px 0; }
.tab {
  border: 1px solid transparent; border-bottom: 0; background: transparent; color: var(--muted);
  font-family: var(--font-body); font-size: 14px; padding: 8px 12px; border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap;
}
.tab[aria-selected="true"] { background: var(--bg); color: var(--ink); border-color: var(--line); font-weight: 500; }
.vhead { padding: 16px 18px 6px; display: grid; gap: 4px; background: var(--bg); }
.vhead p { margin: 0; color: var(--muted); font-size: 14px; }
.scroller { overflow-x: auto; background: var(--bg); padding: 4px 8px 12px; }
.scroller svg { display: block; }
.wl { font-family: var(--font-mono); font-size: 12px; }
.wl.lp { fill: var(--lp); } .wl.pl { fill: var(--pl); } .wl.sb { fill: var(--sb); } .wl.note { fill: var(--muted); }
.wv { fill: none; stroke-width: 1.6; }
.wv.lp { stroke: var(--lp); } .wv.pl { stroke: var(--pl); } .wv.sb { stroke: var(--sb); }
.bus.lp { stroke: var(--lp); fill: color-mix(in srgb, var(--lp) 10%, transparent); }
.bus.pl { stroke: var(--pl); fill: color-mix(in srgb, var(--pl) 10%, transparent); }
.bus.sb { stroke: var(--sb); fill: color-mix(in srgb, var(--sb) 12%, transparent); }
.bus { stroke-width: 1.3; }
.bt { font-family: var(--font-mono); font-size: 10.5px; fill: var(--ink); }
.nt { font-family: var(--font-body); font-size: 11px; fill: var(--muted); font-style: italic; }
.notebox { fill: var(--surface); stroke: var(--line); }
.grid-l { stroke: var(--line); stroke-width: 1; }
.cyc { font-family: var(--font-mono); font-size: 10px; fill: var(--muted); }
.hlr { fill: var(--hl); }
.gapbg { fill: var(--bg); }
.gapz { stroke: var(--muted); stroke-width: 1.2; fill: none; }
.idle { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.steps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; border-top: 1px solid var(--line); }
.stepbar { display: flex; align-items: center; gap: 8px; padding: 12px 18px; flex-wrap: wrap; }
.btn {
  font-family: var(--font-body); font-size: 14px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--pl); color: var(--surface); border-color: var(--pl); }
.dots { display: flex; gap: 6px; margin-left: 4px; flex-wrap: wrap; }
.dot { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-family: var(--font-mono); font-size: 12px; cursor: pointer; padding: 0; }
.dot[aria-current="step"] { background: var(--pl); color: var(--surface); border-color: var(--pl); }
.cycles { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.stepbody { padding: 0 18px 18px; display: grid; gap: 6px; }
.stepbody h3 { font-size: 18px; }
.stepbody p { margin: 0; }
.why { border-left: 3px solid var(--sb); padding-left: 12px; color: var(--muted); font-size: 15px; }

.mini { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.mini .card .scroller { padding: 0; background: transparent; }

pre { background: var(--code); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; margin: 0; }
.callout { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--pl); border-radius: 8px; padding: 14px 16px; }
.callout p { margin: 0; }
.twocol { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
ul.tight { margin: 0; padding-left: 20px; }
ul.tight li { margin: 4px 0; }
footer { padding: 40px 0 60px; color: var(--muted); font-size: 13px; }

/* Rationale cards: rule, why, real-time example, what breaks */
.whys { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 10px; align-content: start; }
.wcard[hidden] { display: none; }
.wcard .meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.wcard .meta span:last-child { text-transform: none; letter-spacing: 0; }
.wcard h3 { font-size: 18px; }
.wcard p { margin: 0; font-size: 15px; }
.wcard .rule { font-size: 14.5px; background: var(--code); border-radius: 6px; padding: 8px 10px; }
.wcard .part { display: grid; gap: 3px; }
.wcard .l { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 500; }
.l-why { color: var(--pl); }
.l-ex { color: var(--sb); }
.l-brk { color: var(--bad); }
.wcard .ex { background: var(--bg); border-left: 3px solid var(--sb); border-radius: 0 8px 8px 0; padding: 8px 12px; }
.wcard .brk { border-left: 3px solid var(--bad); padding-left: 10px; }
.wcard .brk p { color: var(--muted); font-size: 14.5px; }
.wcard ul { margin: 2px 0 0; padding-left: 18px; font-size: 14.5px; }
.wcard ul li { margin: 2px 0; }
.callout ul.tight { margin-top: 6px; font-size: 15px; }
.note-s { color: var(--muted); font-size: 15px; }

/* Spec references */
.src { font-family: var(--font-mono); font-size: 12px; line-height: 1.55; color: var(--muted); margin: 0; max-width: none; }
.src .sl { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--pl); margin-right: 6px; }
.ref { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
td.ref { min-width: 150px; }
figcaption .ref { display: block; margin-top: 6px; }
.kind { display: inline-block; font-family: var(--font-mono); font-size: 10px; line-height: 16px; padding: 0 6px; border-radius: 999px; border: 1px solid currentColor; margin-right: 6px; text-transform: uppercase; letter-spacing: 0.04em; vertical-align: 1px; }
.kind.spec { color: var(--pl); }
.kind.derived { color: var(--sb); }
.kind.illus { color: var(--lp); }
.kind.bg { color: var(--muted); }
.wcard .checks { border-top: 1px dashed var(--line); padding-top: 10px; }
.wcard .checks ul { list-style: none; padding: 0; margin: 4px 0 0; display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
.wcard .checks li { margin: 0; }
.l-src { color: var(--muted); }
.refidx td:first-child { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
@media (max-width: 480px) {
  .wrap { padding: 0 16px; }
  h2 { font-size: 24px; }
  .cycles { margin-left: 0; width: 100%; }
}

/* ---- shared additions for the field-guide series ---- */
.series { font-family: var(--font-mono); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.series a { color: var(--muted); text-decoration: none; }
.series a:hover { color: var(--ink); text-decoration: underline; }
.series .here { color: var(--ink); font-weight: 500; }
.legend .sw.sq { width: 12px; height: 12px; border-radius: 3px; }
.diff td:first-child { font-weight: 500; white-space: nowrap; }
.diff td.same { color: var(--muted); }
.stage { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stage div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.stage div b { display: block; font-family: var(--font-display); font-size: 15px; }
.stage div.on { border-color: var(--pl); background: var(--hl); }
#quiz details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
#quiz details + details { margin-top: 10px; }
#quiz summary { cursor: pointer; font-weight: 500; list-style: none; display: block; position: relative; padding-left: 22px; }
#quiz summary::-webkit-details-marker { display: none; }
#quiz summary::before { content: "+"; font-family: var(--font-mono); color: var(--pl); position: absolute; left: 0; top: 0; }
#quiz details[open] summary::before { content: "–"; }
#quiz details > div { padding: 8px 0 2px 22px; display: grid; gap: 6px; }
#quiz details > div p { margin: 0; font-size: 15px; }
#quiz .lvl { display: inline-block; font-family: var(--font-mono); font-size: 10.5px; font-weight: 400; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin-left: 8px; white-space: nowrap; vertical-align: 1px; }
.bitfield { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(28px, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-family: var(--font-mono); font-size: 11.5px; background: var(--surface); }
.bitfield > div { border-right: 1px solid var(--line); padding: 6px 4px; text-align: center; display: grid; gap: 2px; align-content: start; }
.bitfield > div:last-child { border-right: 0; }
.bitfield .bn { color: var(--muted); font-size: 10px; }
.bitfield .f { font-weight: 500; }
.bitfield .f.lp { color: var(--lp); } .bitfield .f.pl { color: var(--pl); } .bitfield .f.sb { color: var(--sb); }
.flow { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.flow > div { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.flow > div:last-child { border-bottom: 0; }
.flow .n { font-family: var(--font-mono); font-size: 12px; color: var(--surface); background: var(--pl); border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; }
.flow p { margin: 0; font-size: 15px; }
.grid > *, .twocol > *, .whys > *, .mini > * { min-width: 0; }
code { overflow-wrap: anywhere; }


/* ---- AXI additions ---- */
.ver { display:inline-block; font-family:var(--font-mono); font-size:10.5px; line-height:16px; padding:0 6px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; vertical-align:1px; }
.ver.new { color:var(--pl); border-color:var(--pl); }
.ver.old { color:var(--lp); border-color:var(--lp); }
.ver.gone { color:var(--bad); border-color:var(--bad); }
.cmp td:first-child { font-weight:500; min-width:150px; }
.cmp td.then { color:var(--muted); }
.dep text { font-family:var(--font-mono); font-size:12px; }
.kbd { font-family:var(--font-mono); font-size:12px; border:1px solid var(--line); border-radius:4px; padding:0 5px; background:var(--code); }

/* ---- phone and touch upgrades ---- */
.calc, .tool { grid-template-columns: minmax(0, 1fr); }
.calc > *, .tool > * { min-width: 0; }
#wave { display: flex; align-items: flex-start; padding-left: 0; scroll-behavior: auto; }
#wave > svg { flex: none; }
.wfix { position: sticky; left: 0; z-index: 1; flex: none; background: var(--bg); border-right: 1px solid var(--line); }
nav.toc a[aria-current] { background: var(--hl); color: var(--ink); font-weight: 500; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 8px 0 28px; }
.pager a { display: grid; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--ink); }
.pager a:hover { border-color: var(--pl); }
.pager a small { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pager a.nx { text-align: right; grid-column: 2; }
.pager a strong { font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.pager .all { grid-column: 1 / -1; text-align: center; font-size: 14px; padding: 10px; }
@media (pointer: coarse) {
  .chip, .tab, .btn, nav.toc a { min-height: 40px; display: inline-flex; align-items: center; }
  .dot { min-width: 38px; min-height: 38px; }
  summary { padding-top: 12px; padding-bottom: 12px; }
}
@media (max-width: 640px) {
  .hero { padding-top: 18px; padding-bottom: 16px; }
  .lede { font-size: 15.5px; }
  .series { flex-wrap: nowrap; overflow-x: auto; white-space: nowrap; gap: 4px 14px; padding: 6px 0; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
  .series::-webkit-scrollbar { display: none; }
  .series > * { flex: none; }
  figure { overflow-x: auto; }
  figure svg { min-width: 560px; max-width: none; }
  figure svg.dep, figure svg.lmap { min-width: 700px; }
  figcaption { position: sticky; left: 0; }
  table.stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  table.stack, table.stack tbody, table.stack tr, table.stack td { display: block; width: auto; }
  table.stack tr { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  table.stack tr:last-child { border-bottom: 0; }
  table.stack td { padding: 3px 0; border: 0; min-width: 0 !important; white-space: normal !important; text-align: left !important; overflow-wrap: anywhere; }
  table.stack td:empty { display: none; }
  table.stack td::before { content: attr(data-label); display: block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
  table.stack td:first-child { font-size: 15px; font-weight: 600; }
  table.stack td:first-child::before { display: none; }
  table.stack caption { display: block; }
  table.stack td.dir, table.stack td.dir + td { display: inline-block; margin-right: 10px; vertical-align: middle; }
  table.stack td.dir::before, table.stack td.dir + td::before { display: none; }
  .pager { grid-template-columns: 1fr; }
  .pager a.nx { grid-column: 1; text-align: left; }
  .bitfield { grid-auto-columns: minmax(22px, 1fr); overflow-x: auto; }
}
</style>
